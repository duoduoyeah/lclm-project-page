<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LCLM vs AR — real generation</title>
<style>
  :root {
    --blue:#2563eb; --blue-pale:#dbeafe; --ink:#111; --muted:#666; --line:#e2e1dc;
    --accent-1:#2563eb; --accent-2:#7c3aed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px;
    font-family: 'Inter', ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f3f2ef; color: var(--ink);
  }
  .badge {
    display: inline-block; font-size: .72rem; font-weight: 600; letter-spacing: .02em;
    color: var(--blue); background: var(--blue-pale); border-radius: 999px;
    padding: 3px 10px; margin-bottom: 6px;
  }
  .subnote { font-size: .74rem; color: var(--muted); margin: 0 0 12px 0; }

  /* Horizontally scrollable example picker */
  #picker {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 16px;
    border-bottom: 1px solid var(--line); scrollbar-width: thin;
  }
  #picker button {
    flex: none; font: inherit; font-size: .78rem; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--muted); cursor: pointer;
    white-space: nowrap;
  }
  #picker button:hover { border-color: var(--blue); color: var(--blue); }
  #picker button.active { background: var(--blue); border-color: var(--blue); color: #fff; }

  .example {
    --accent: var(--accent-1);
    background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--accent);
    border-radius: 10px; padding: 16px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .example-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .example-title { font-size: .95rem; font-weight: 700; color: var(--accent); }
  .example-count { font-size: .72rem; color: var(--muted); }
  .prompt { font-size: .82rem; color: var(--muted); margin: 0 0 10px 0; }
  .prompt b { color: var(--ink); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
  .col h4 {
    margin: 0 0 6px 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); display: flex; justify-content: space-between; align-items: baseline;
  }
  .col h4 .stat { font-variant-numeric: tabular-nums; color: var(--blue); font-weight: 700; }
  .box {
    background: #fafaf8; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; min-height: 190px; max-height: 340px; overflow-y: auto;
    font-size: .84rem; line-height: 1.5;
  }
  .ar-text { white-space: pre-wrap; word-break: break-word; }
  .lclm-line {
    display: block; white-space: pre-wrap; word-break: break-word;
    padding: 2px 0; border-bottom: 1px dashed transparent;
  }
  .lclm-line.pending { color: #bbb; }
  .cursor {
    display: inline-block; width: 2px; height: 1em; background: var(--blue);
    vertical-align: text-bottom; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .note { font-size: .72rem; color: var(--muted); margin-top: 10px; }
  .fail-flag {
    display: inline-block; font-size: .68rem; font-weight: 700; color: #92400e;
    background: #fef3c7; border-radius: 999px; padding: 2px 8px; margin-left: 6px;
  }
</style>
</head>
<body>

<span class="badge">Real output &middot; matched 881M-parameter (depth-24) checkpoints, ClimbMix-trained</span>
<p class="subnote">
  All 13 real matched-prompt traces from this dump are here, not a cherry-picked pair &mdash;
  including cases where LCLM barely uses parallelism on that prompt. Pick any one below.
</p>

<div id="picker"></div>
<div id="stage"></div>

<script src="static/js/gen-compare-data.js"></script>
<script>
const STAGE = document.getElementById('stage');
const PICKER = document.getElementById('picker');
const STEP_MS = 90;
const HOLD_MS = 1800;

let activeTimer = null;

function stopActive() {
  if (activeTimer) { clearTimeout(activeTimer); activeTimer = null; }
}

function show(ex, idx) {
  stopActive();
  STAGE.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'example';
  wrap.style.setProperty('--accent', idx % 2 === 0 ? 'var(--accent-1)' : 'var(--accent-2)');

  const header = document.createElement('div');
  header.className = 'example-header';
  const lowParallel = ex.totalLines <= 3;
  header.innerHTML =
    `<span class="example-title">${ex.title}</span>` +
    `<span class="example-count">${ex.totalLines} line${ex.totalLines === 1 ? '' : 's'} total</span>` +
    (lowParallel ? '<span class="fail-flag">low parallelism on this prompt</span>' : '');
  wrap.appendChild(header);

  const p = document.createElement('p');
  p.className = 'prompt';
  p.innerHTML = '<b>Prompt:</b> ' + ex.prompt;
  wrap.appendChild(p);

  const cols = document.createElement('div');
  cols.className = 'cols';

  const arCol = document.createElement('div');
  arCol.className = 'col';
  arCol.innerHTML = '<h4>Vanilla AR</h4><div class="box"><span class="ar-text" data-role="ar-text"></span><span class="cursor"></span></div>';
  cols.appendChild(arCol);

  const lcCol = document.createElement('div');
  lcCol.className = 'col';
  lcCol.innerHTML = '<h4>LCLM (ours) <span class="stat" data-role="lc-stat">0 tok/step</span></h4><div class="box" data-role="lc-box"></div>';
  cols.appendChild(lcCol);

  wrap.appendChild(cols);

  const note = document.createElement('p');
  note.className = 'note';
  wrap.appendChild(note);

  STAGE.appendChild(wrap);

  const lcBox = lcCol.querySelector('[data-role="lc-box"]');
  const lineEls = ex.lines.map(() => {
    const el = document.createElement('span');
    el.className = 'lclm-line pending';
    lcBox.appendChild(el);
    return el;
  });

  const arTextEl = arCol.querySelector('[data-role="ar-text"]');
  const lcStatEl = lcCol.querySelector('[data-role="lc-stat"]');

  let step = 0;

  function render() {
    let arOut = '';
    for (let i = 0; i < ex.ar.length && i < step; i++) arOut += ex.ar[i];
    arTextEl.textContent = arOut;

    let tokThisStep = 0;
    ex.lines.forEach((line, i) => {
      const el = lineEls[i];
      const toks = line.tokens.filter(t => t.step <= step);
      if (toks.length === 0) {
        el.classList.add('pending');
        el.textContent = `line ${i + 1} — not active yet`;
      } else {
        el.classList.remove('pending');
        el.textContent = toks.map(t => t.char).join('');
        if (toks[toks.length - 1].step === step) tokThisStep++;
      }
    });
    lcStatEl.textContent = tokThisStep + ' tok/step';
    note.textContent = `Showing ${ex.shownLines} of ${ex.totalLines} lines LCLM actually kept active on this prompt, capped for legibility. Step ${step}/${ex.maxStep}.`;
  }

  function tick() {
    step++;
    if (step > ex.maxStep) {
      render();
      activeTimer = setTimeout(() => { step = 0; render(); activeTimer = setTimeout(tick, STEP_MS); }, HOLD_MS);
      return;
    }
    render();
    activeTimer = setTimeout(tick, STEP_MS);
  }

  render();
  activeTimer = setTimeout(tick, STEP_MS);
}

GEN_COMPARE_DATA.examples.forEach((ex, idx) => {
  const btn = document.createElement('button');
  btn.textContent = ex.title;
  btn.dataset.idx = idx;
  btn.addEventListener('click', () => {
    [...PICKER.children].forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    show(ex, idx);
  });
  PICKER.appendChild(btn);
});

if (GEN_COMPARE_DATA.examples.length) {
  PICKER.children[0].classList.add('active');
  show(GEN_COMPARE_DATA.examples[0], 0);
}
</script>

</body>
</html>
